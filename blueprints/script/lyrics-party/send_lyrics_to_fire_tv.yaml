blueprint:
  name: Send lyrics to Fire TV
  description: >-
    Opens a Lyrics Party dashboard in Fully Kiosk Browser on a Fire TV over ADB.
    Create one script per TV, then run it from a dashboard button. This is a
    script, so it only runs when you start it.
  domain: script
  source_url: https://github.com/introy-prog/lyrics-party-card/blob/main/blueprints/script/lyrics-party/send_lyrics_to_fire_tv.yaml
  input:
    fire_tv:
      name: Fire TV
      description: The Fire TV, added through the Android Debug Bridge integration.
      selector:
        entity:
          integration: androidtv
          domain: media_player
    dashboard_url:
      name: Dashboard URL
      description: >-
        Full URL of the lyrics dashboard as the Fire TV reaches it, for example
        http://192.168.1.10:8123/lyrics-party/0
      selector:
        text:
          type: url
    room:
      name: Room (optional)
      description: >-
        Show this media player. Leave it empty to use the speaker in the same
        Home Assistant area as the Fire TV, or to follow whatever is playing if
        that area has no speaker.
      default: ""
      selector:
        entity:
          domain: media_player

mode: single

variables:
  fire_tv: !input fire_tv
  dashboard_url: !input dashboard_url
  chosen_room: !input room
  tv_area: "{{ area_id(fire_tv) }}"
  room: >-
    {% if chosen_room %}{{ chosen_room }}{% elif tv_area %}{{
    (area_entities(tv_area) | select('search', '^media_player\\.')
    | select('is_state_attr', 'device_class', 'speaker') | list + [''])[0]
    }}{% endif %}
  url: >-
    {{ dashboard_url ~ ((('&' if '?' in dashboard_url else '?') ~ 'room=' ~ room) if room else '') }}

sequence:
  - action: androidtv.adb_command
    target:
      entity_id: !input fire_tv
    data:
      command: >-
        am start -n de.ozerov.fully/.MainActivity -a android.intent.action.VIEW -d "{{ url }}"
